<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}RailPulse{% endblock %} — Track Condition Monitoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
{% block head_extra %}{% endblock %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="topbar">
  <div class="topbar__brand">
    <span class="topbar__mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" width="30" height="30">
        <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <path d="M8 24 L32 24 M8 16 L32 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M12 12 L12 28 M28 12 L28 28" stroke="currentColor" stroke-width="1.4" opacity="0.55"/>
      </svg>
    </span>
    <div>
      <h1>RailPulse</h1>
      <p>Vibration Frequency Analysis &amp; Fourier Series Monitoring</p>
    </div>
  </div>

  <nav class="topbar__nav" aria-label="Primary">
    <a href="{{ url_for('upload_page') }}" class="navlink {{ 'navlink--active' if active_page == 'upload' else '' }}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0-12l-4 4m4-4l4 4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
      Upload Dataset
    </a>
    <a href="{{ url_for('monitor_page') }}" class="navlink {{ 'navlink--active' if active_page == 'monitor' else '' }}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg>
      Live Monitoring
    </a>
  </nav>

  <div class="topbar__meta">
    <div class="topbar__line"><span class="dot dot--live"></span> <span id="mode-indicator">Simulated Demo</span></div>
    <div class="topbar__line mono" id="clock">--:--:--</div>
  </div>
</header>

<main class="layout">
  {% block content %}{% endblock %}
</main>

<script>
  function tickClock(){
    const el = document.getElementById('clock');
    if (el) el.textContent = new Date().toLocaleTimeString('en-GB', { hour12: false });
  }
  setInterval(tickClock, 1000);
  tickClock();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
